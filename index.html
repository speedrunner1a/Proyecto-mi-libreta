          <input id="ob_name" type="text" placeholder="Ej: José" value="${escapeHtml(onboardingDraft.name)}" required autofocus maxlength="30">
        </div>
        <button class="btn btn-primary" type="submit">Continuar</button>
      </form>`;
  } else if(step === 'datos'){
    body = `
      <div class="text-center mb-4 mt-1">
        <div class="text-[42px] mb-2 animate-popIn">📅</div>
        <h3 class="text-lg font-serif font-bold mb-1.5">Un par de datos más</h3>
        <p class="text-[13px] text-[#8E8E93] leading-relaxed">Esto nos ayuda a calcular tu resumen. Lo podés cambiar cuando quieras en Ajustes.</p>
      </div>
      <form onsubmit="return onboardingSubmitDatos(event)">
        <div class="field mb-3.5">
          <label for="ob_payday">Día de cobro (1-31)</label>
          <input id="ob_payday" type="number" min="1" max="31" value="${onboardingDraft.paydayDay}" required>
        </div>
        <div class="field mb-3.5">
          <label for="ob_currency">Moneda</label>
          <input id="ob_currency" type="text" value="${escapeHtml(onboardingDraft.currency)}" maxlength="6" required>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-outline" type="button" onclick="onboardingBack()">Atrás</button>
          <button class="btn btn-primary" type="submit">Continuar</button>
        </div>
      </form>`;
  } else if(step === 'tour1'){
    body = onboardingTourSlide('🔵', `${onboardingDraft.name}, así es como registrás tus gastos`, 'El botón <b>+</b> flotante agrega un movimiento nuevo en segundos.');
  } else if(step === 'tour2'){
    body = onboardingTourSlide('🏠', 'Tu resumen, siempre a mano', '<b>Inicio</b> te muestra el resumen del mes, cuánto falta para cobrar y tus metas de ahorro.');
  } else if(step === 'tour3'){
    body = onboardingTourSlide('🧭', 'Y si necesitás una mano', '<b>Asistente</b> tiene tus alertas, presupuestos por categoría y la IA. En <b>Ajustes</b> (el ⚙️ arriba) configurás todo lo demás.', true);
  }

  openModal(`${onboardingProgressHtml()}${body}`);
}

function onboardingTourSlide(emoji, title, text, isLast){
  return `
    <div class="text-center mb-4 mt-1 animate-fadeIn">
      <div class="text-[42px] mb-2">${emoji}</div>
      <h3 class="text-lg font-serif font-bold mb-1.5">${title}</h3>
      <p class="text-[13.5px] text-[#8E8E93] leading-relaxed">${text}</p>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-outline" onclick="onboardingBack()">Atrás</button>
      <button class="btn btn-primary" onclick="${isLast ? 'finishOnboarding()' : 'onboardingNext()'}">${isLast ? '¡Empezar! 🎉' : 'Siguiente'}</button>
    </div>`;
}

function onboardingSubmitName(e){
  e.preventDefault();
  const val = document.getElementById('ob_name').value.trim();
  if(!val) return false;
  onboardingDraft.name = val;
  onboardingNext();
  return false;
}
function onboardingSubmitDatos(e){
  e.preventDefault();
  const payday = Number(document.getElementById('ob_payday').value);
  const currency = document.getElementById('ob_currency').value.trim();
  onboardingDraft.paydayDay = (payday >= 1 && payday <= 31) ? payday : 30;
  onboardingDraft.currency = currency || 'Gs.';
  onboardingNext();
  return false;
}
function onboardingNext(){
  onboardingStepIndex = Math.min(onboardingStepIndex + 1, ONBOARDING_STEPS.length - 1);
  renderOnboardingStep();
}
function onboardingBack(){
  onboardingStepIndex = Math.max(onboardingStepIndex - 1, 0);
  renderOnboardingStep();
}
function finishOnboarding(){
  state.userName = onboardingDraft.name;
  state.settings.paydayDay = onboardingDraft.paydayDay;
  state.settings.currency = onboardingDraft.currency;
  state.onboardingDone = true;
  save();
  closeModal();
  render();
}

/* ---------- Toasts ---------- */
function toast(message) {
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();

  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  const msg = document.createElement('span');
  msg.className = 'toast-msg';
  msg.textContent = message; // sigue usando textContent: sin riesgo de inyectar HTML
  el.appendChild(msg);
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, 2400);
}

document.getElementById('overlay').addEventListener('click', function(e) {
  if(e.target === this) closeModal();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ closeIosSelectSheet(); closeModal(); }
});

/* ---------- Teclado virtual (visualViewport) ----------
   En iOS Safari el "layout viewport" NO se achica cuando aparece
   el teclado (solo lo hace el "visual viewport"); en Android suele
   variar según el navegador. Como #overlay es position:fixed +
   inset:0, sin este ajuste la hoja modal se queda anclada al fondo
   de TODA la pantalla, que ahora está tapado por el teclado: el
   campo que el usuario está completando termina escondido detrás.
   Con esto, el overlay sigue exactamente el alto/posición visibles
   reales, así la hoja modal queda siempre justo arriba del teclado. */
function syncOverlayToViewport(){
  const overlay = document.getElementById('overlay');
  if(!overlay || !window.visualViewport) return;
  const vv = window.visualViewport;
  overlay.style.height = vv.height + 'px';
  overlay.style.top = vv.offsetTop + 'px';
  document.body.classList.toggle('keyboard-open', (window.innerHeight - vv.height) > 120);
  if(typeof window.refreshLiquidGlass === 'function') window.refreshLiquidGlass();
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', syncOverlayToViewport);
  window.visualViewport.addEventListener('scroll', syncOverlayToViewport);
}
/* Al enfocar un campo de texto dentro del modal, lo acercamos a la
   vista recién cuando el teclado terminó de animarse (si lo hacemos
   antes, el cálculo de posición queda desactualizado). */
document.addEventListener('focusin', function(e){
  const el = e.target;
  if(el.matches && el.matches('#modal input, #modal textarea, #modal select')){
    setTimeout(()=> el.scrollIntoView({block:'center', behavior:'smooth'}), 300);
  }
});

/* ---------- Arranque ---------- */
render();
maybeShowOnboarding();
</script>
