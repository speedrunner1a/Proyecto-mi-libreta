    <p class="text-[12.5px] text-[#8E8E93] mb-3.5 leading-relaxed">Según tu gasto promedio de los últimos meses, esto es lo que te sugerimos por categoría. Podés aplicar cada una por separado.</p>
    <div id="budget_ai_body">
      <div class="ai-skeleton"><div class="line" style="width:100%"></div><div class="line" style="width:85%"></div><div class="line" style="width:92%"></div></div>
    </div>
  `);
  loadBudgetAISuggestions(historial);
}

function loadBudgetAISuggestions(historial){
  const cfg = state.aiConfig;
  const hasKey = cfg.provider === 'gemini' ? !!cfg.geminiApiKey : !!cfg.apiKey;
  const cats = Object.keys(historial);

  if(!hasKey){
    renderBudgetSuggestions(cats.map(catId => ({
      catId, suggested: Math.round(historial[catId].promedio * 1.05 / 1000) * 1000
    })), false);
    return;
  }

  let txt = `Con base en el gasto real promedio mensual de los últimos meses en cada categoría, sugerime un presupuesto mensual razonable para cada una (un poco por encima del promedio, para no ser tan ajustado, pero sin pasarse). Respondé ÚNICAMENTE en formato JSON válido, un array de objetos con "catId" y "monto" (número entero, sin puntos ni comas), sin texto adicional ni markdown. Estas son las categorías con su promedio mensual:\n\n`;
  cats.forEach(catId=>{ txt += `- catId "${catId}" (${catInfo(catId).label}): promedio ${Math.round(historial[catId].promedio)} Gs., calculado sobre ${historial[catId].meses} mes(es)\n`; });

  callAI(txt)
    .then(answer=>{
      const parsed = parseBudgetSuggestionJSON(answer);
      if(!parsed || !parsed.length) throw new Error('respuesta vacía');
      renderBudgetSuggestions(parsed.map(p=>({catId:p.catId, suggested: Number(p.monto)||0})).filter(p=>p.suggested>0), true);
    })
    .catch(()=>{
      // Si la IA falla o no devuelve JSON usable, no dejamos la pantalla
      // colgada: caemos al promedio histórico igual que sin clave.
      renderBudgetSuggestions(cats.map(catId => ({
        catId, suggested: Math.round(historial[catId].promedio * 1.05 / 1000) * 1000
      })), false, true);
    });
}

/* Extrae el primer array JSON válido de la respuesta, por si la IA agrega
   texto alrededor pese a la instrucción de responder solo JSON. */
function parseBudgetSuggestionJSON(text){
  if(!text) return null;
  try { return JSON.parse(text); } catch(e){}
  const match = text.match(/\[[\s\S]*\]/);
  if(match){ try { return JSON.parse(match[0]); } catch(e){} }
  return null;
}

function renderBudgetSuggestions(list, fromAI, aiFailed){
  const body = document.getElementById('budget_ai_body');
  if(!body) return;
  if(!list.length){
    body.innerHTML = `<div class="text-[13px] text-[#8E8E93] text-center py-4">No se pudieron generar sugerencias.</div>`;
    return;
  }
  window.__budgetAISuggestions = {};
  list.forEach(item => { window.__budgetAISuggestions[item.catId] = item.suggested; });

  body.innerHTML = `
    ${aiFailed ? `<div class="flex gap-2.5 items-center p-3 rounded-xl text-[12.5px] leading-relaxed mb-3 ${insightClasses('rust')}"><span>⚠️</span><span>No se pudo consultar la IA — se calculó con el promedio de gastos reales.</span></div>` : ''}
    ${list.map(item=>{
      const cat = catInfo(item.catId);
      return `
      <div class="flex justify-between items-center py-2.5 border-b border-black/[0.05] dark:border-white/[0.07] last:border-b-0">
        <div>
          <div class="font-semibold text-[13.5px]">${cat.icon} ${cat.label}</div>
          <div class="font-mono text-[12.5px] text-[#8E8E93]">${fmt(item.suggested)} / mes</div>
        </div>
        <button class="btn btn-sm btn-primary" data-apply-budget="${item.catId}">Aplicar</button>
      </div>`;
    }).join('')}
    <div class="text-[11px] text-[#8E8E93] mt-3 text-center">${fromAI && !aiFailed ? 'Sugerido por IA en base a tu historial real.' : 'Calculado con el promedio de tus últimos meses.'}</div>
  `;
  body.querySelectorAll('[data-apply-budget]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const catId = btn.getAttribute('data-apply-budget');
      const monto = window.__budgetAISuggestions[catId];
      if(setBudget(catId, monto)){
        closeModal(); render();
        toast(`Presupuesto de ${catInfo(catId).label} aplicado 💰`);
      }
    });
  });
}

/* ---------- Resumen e insights ---------- */
function getResumenFinanciero(){
  const mk = currentMonthKey();

  // Las cuentas "apartadas" (ej: ahorro para la facultad) tienen un
  // destino fijo y no son plata disponible para el día a día.
  const totalCuentas = state.accounts.reduce((s,a) => s + (a.apartada ? 0 : a.balance), 0);
  const totalAhorroMetas = state.metasAhorro.reduce((s, m) => s + m.currentAmount, 0);

  const gastosFijosPagadosMes = getTotalGastosFijosMes();
  const gastosFijosPendientesMes = state.gastosFijos
    .filter(g => !(g.pagado && g.mesPagado === mk))
    .reduce((s,g) => s + g.amount, 0);

  const gastosVariables = state.transactions
    .filter(t => t.type === 'gasto' && t.date.slice(0,7) === mk && t.category!=='ajuste' && t.category!=='ahorro')
    .reduce((s, t) => s + t.amount, 0);

  const ingresosMes = state.transactions
    .filter(t => t.type === 'ingreso' && t.date.slice(0,7) === mk && t.category!=='ajuste')
    .reduce((s, t) => s + t.amount, 0);

  // ---------- Disponible calculado CUENTA POR CUENTA ----------
  // Antes se sumaban todas las cuentas en un pozo único y se le restaban
  // todos los gastos fijos y variables, sin importar de qué cuenta salían.
  // Eso hacía que, por ejemplo, la cuota de la facultad (que sale de la
  // cuenta Facultad, con plata de sobra) contara como "deuda" contra el
  // saldo de la cuenta Principal, que es una cuenta totalmente distinta.
  // Ahora cada cuenta se evalúa con SU PROPIO saldo, SUS propios gastos
  // fijos (según su accountId) y SUS propios gastos variables — y recién
  // al final se suma todo para dar un número general, ya sin mezclar
  // faltantes de una cuenta con sobrantes de otra.
  const reservar = state.settings.reservarGastosFijosPendientes;
  let saldoDisponible = 0;
  let disponibleVariable = 0;
  const cuentasEnRojo = []; // cuentas cuyo propio saldo no alcanza para sus propios compromisos

  // Gastos fijos "huérfanos": su cuenta de origen ya no existe (fue
  // borrada). No pertenecen a ninguna cuenta real, así que se muestran
  // aparte en vez de perderse silenciosamente del cálculo.
  const idsCuentasValidas = new Set(state.accounts.map(a => a.id));
  const gastosFijosHuerfanos = state.gastosFijos.filter(g => !idsCuentasValidas.has(g.accountId));
  const gastosFijosHuerfanosPendientes = gastosFijosHuerfanos
    .filter(g => !(g.pagado && g.mesPagado === mk))
    .reduce((s,g) => s + g.amount, 0);
  if(reservar) saldoDisponible -= gastosFijosHuerfanosPendientes;

  state.accounts.forEach(acc => {
    if(acc.apartada) return; // no participa del disponible general

    // Meta(s) vinculadas a esta cuenta: esa plata tiene destino propio.
    const metaLigada = totalAhorroMetasPorCuenta(acc.id);

    // Gastos fijos de ESTA cuenta (según su accountId), separados en
    // pagados (ya salieron del balance real) y pendientes.
    const fijosCuenta = state.gastosFijos.filter(g => (g.accountId || 'principal') === acc.id);
    const fijosPendientesCuenta = fijosCuenta
      .filter(g => !(g.pagado && g.mesPagado === mk))
      .reduce((s,g) => s + g.amount, 0);
    const reservaCuenta = reservar ? fijosPendientesCuenta : 0;

    // Gastos variables pagados desde ESTA cuenta este mes.
    const variablesCuenta = state.transactions
      .filter(t => t.type === 'gasto' && t.accountId === acc.id && t.date.slice(0,7) === mk && t.category!=='ajuste' && t.category!=='ahorro')
      .reduce((s,t) => s + t.amount, 0);

    const dispCuenta = acc.balance - metaLigada - reservaCuenta;
    const dispVariableCuenta = dispCuenta - variablesCuenta;

    saldoDisponible += dispCuenta;
    disponibleVariable += dispVariableCuenta;
    if(dispVariableCuenta < 0) cuentasEnRojo.push({ name: acc.name, faltante: -dispVariableCuenta });
  });

  if(reservar) disponibleVariable -= gastosFijosHuerfanosPendientes;

  const totalGastos = gastosFijosPagadosMes + gastosFijosPendientesMes + gastosVariables;

  return {
    totalCuentas, gastosFijosMes: gastosFijosPagadosMes, gastosFijosPendientesMes, gastosVariables, totalGastos, ingresosMes, saldoDisponible, totalAhorroMetas, disponibleVariable, cuentasEnRojo, gastosFijosHuerfanos,
    tasaAhorro: ingresosMes > 0 ? Math.round((totalAhorroMetas / ingresosMes) * 100) : 0
  };
}

/* Suma el currentAmount de las metas vinculadas a una cuenta puntual
   (normalmente una sola, pero por si acaso soporta varias). */
function totalAhorroMetasPorCuenta(accountId){
  return state.metasAhorro
    .filter(m => m.linkedAccountId === accountId)
    .reduce((s,m) => s + m.currentAmount, 0);
}

/* Insights basados en reglas: se siguen usando en la pestaña Asistente
   como alertas rápidas, pero el Dashboard (Inicio) ahora usa análisis de IA. */
function generateInsights(){
  const insights = [];
  const resumen = getResumenFinanciero();

  // Metas
  state.metasAhorro.forEach(meta => {
    const pct = meta.targetAmount > 0 ? (meta.currentAmount / meta.targetAmount) * 100 : 0;
    const proy = calcularProyeccionMeta(meta);
    if(pct >= 100) {
      insights.push({level:'green', ic:'🎉', text:`¡Lograste tu meta "${meta.name}"!`});
    } else if(pct >= 75) {
      insights.push({level:'green', ic:'💪', text:`Vas muy bien con "${meta.name}": ${Math.round(pct)}% completado.`});
    } else if(proy && proy.fuente !== 'completo'){
      const tiempo = proy.dias <= 60 ? `${proy.dias} día${proy.dias===1?'':'s'}` : `${proy.meses} mes${proy.meses===1?'':'es'}`;
      const origen = proy.fuente === 'ritmo_real' ? ' (según tu ritmo real)' : '';
      insights.push({level:'mustard', ic:'⏳', text:`"${meta.name}": ${tiempo} restantes${origen} a este ritmo.`});
    }
  });

  // Flujo de caja disponible tras gastos fijos y lo ya gastado este mes
  insights.push({
    level: resumen.disponibleVariable < 0 ? 'rust' : 'green',
    ic: '💵',
    text: state.settings.reservarGastosFijosPendientes
      ? `Después de tus gastos fijos (pagados y reservados) te quedan ${fmt(resumen.disponibleVariable)} para gastos variables este mes.`
      : `Después de tus gastos fijos ya pagados, te quedan ${fmt(resumen.disponibleVariable)} para gastos variables este mes.`
  });

  // Cuentas con saldo bajo (las apartadas, como el ahorro para la
  // facultad, no avisan acá: tienen un destino fijo y se vacían a
  // propósito con el tiempo, no es un problema que bajen).
  const umbral = state.settings.lowBalanceThreshold || 50000;
  state.accounts.forEach(a=>{
    if(!a.apartada && a.balance < umbral){
      insights.push({level:'rust', ic:'⚠️', text:`Tu cuenta "${a.name}" tiene saldo bajo (${fmt(a.balance)}).`});
    }
  });

  // Cuentas específicas que no alcanzan para sus propios compromisos
  // (ej: "Principal" no cubre el Wifi), en vez de un número general que
  // mezcla el faltante de una cuenta con el sobrante de otra.
  resumen.cuentasEnRojo.forEach(c=>{
    insights.push({level:'rust', ic:'🔻', text:`La cuenta "${c.name}" no alcanza a cubrir sus propios gastos: faltan ${fmt(c.faltante)}.`});
  });

  // Gastos fijos cuya cuenta de origen fue borrada: no se descuentan de
  // ninguna cuenta real hasta que se les asigne una de nuevo.
  if(resumen.gastosFijosHuerfanos.length){
    const nombres = resumen.gastosFijosHuerfanos.map(g=>`"${g.name}"`).join(', ');
    insights.push({level:'mustard', ic:'❓', text:`${nombres} ${resumen.gastosFijosHuerfanos.length===1?'no tiene':'no tienen'} cuenta de origen asignada (la cuenta original fue eliminada). Asignale una cuenta para que se contabilice bien.`});
  }

  // Gastos fijos próximos a vencer (dentro de 3 días)
  const now = new Date(); now.setHours(0,0,0,0);
  state.gastosFijos
    .filter(g => !(g.pagado && g.mesPagado === currentMonthKey()))
    .forEach(g=>{
      const next = nextOccurrence(g.dueDay, now);
      const dias = daysBetween(now, next);
      if(dias <= 3){
        insights.push({level: dias<=1?'rust':'mustard', ic:'⏰', text:`"${g.name}" vence en ${dias===0?'hoy':dias+' día(s)'} (${fmt(g.amount)}).`});
      }
    });

  // Recordatorios próximos a vencer o ya vencidos
  state.recordatorios
    .filter(r => !r.completado)
    .forEach(r=>{
      const dias = daysBetween(now, new Date(r.fecha+'T00:00:00'));
      if(dias <= 3){
        const texto = dias < 0 ? `venció hace ${-dias} día(s)` : dias===0 ? 'es hoy' : `vence en ${dias} día(s)`;
        insights.push({level: dias<=0?'rust':'mustard', ic:'🔔', text:`Recordatorio "${r.titulo}" ${texto}${r.monto?` (${fmt(r.monto)})`:''}.`});
      }
    });

  // Presupuestos superados o cerca del límite (respeta período semanal/mensual)
  Object.keys(state.budgets).forEach(catId=>{
    const p = getBudgetProgreso(catId);
    if(!p) return;
    if(p.pct >= 100){
      insights.push({level:'rust', ic:'📛', text:`Superaste el presupuesto de ${catInfo(catId).label} (${fmt(p.gastado)} / ${fmt(p.amount)}).`});
    } else if(p.pct >= 90){
      insights.push({level:'mustard', ic:'📊', text:`Estás cerca del límite en ${catInfo(catId).label} (${fmt(p.gastado)} / ${fmt(p.amount)}).`});
    }
  });

  const pendientes = state.gastosFijos.filter(g => !g.pagado);
  if(pendientes.length > 0) {
    const total = pendientes.reduce((s, g) => s + g.amount, 0);
    insights.push({level: 'mustard', ic: '📋', text: `Tenés ${pendientes.length} gastos fijos pendientes (${fmt(total)}).`});
  }

  if(resumen.saldoDisponible < 0) {
    insights.push({level: 'rust', ic: '🚨', text: `Saldo disponible negativo (${fmt(resumen.saldoDisponible)}).`});
  }

  if(!insights.length) insights.push({level:'green', ic:'✅', text:'Todo bajo control.'});
  return insights;
}

function insightClasses(level){
  const map = {
    green: 'bg-[rgba(48,209,88,0.12)] text-[#248A3D] dark:bg-[rgba(48,209,88,0.18)] dark:text-[#30D158]',
    mustard: 'bg-[rgba(255,159,10,0.12)] text-[#B25E00] dark:bg-[rgba(255,159,10,0.18)] dark:text-[#FF9F0A]',
    rust: 'bg-[rgba(255,69,58,0.12)] text-[#D70015] dark:bg-[rgba(255,69,58,0.18)] dark:text-[#FF453A]'
  };
  return map[level] || map.green;
}

/* Bloque "welcome back" que se desvanece solo, mostrando un dato

   sesión (ver sessionStorage más abajo) y luego desaparece dejando

function proximaMetaConProyeccion(){
  return state.metasAhorro
    .map(m => ({ meta: m, proy: calcularProyeccionMeta(m) }))
    .filter(x => x.proy && x.proy.dias > 0)
    .sort((a,b) => a.proy.dias - b.proy.dias)[0];
}

    {id:'inicio', label:'Inicio', ic:'🏠'},
    {id:'cuentas', label:'Cuentas', ic:'💳'},
    {id:'movimientos', label:'Historial', ic:'📜'},
    {id:'transferir', label:'Transferir', ic:'🔁'},
    {id:'estadisticas', label:'Stats', ic:'📊'},
    {id:'asistente', label:'Asistente', ic:'🧭'},
    {id:'metas', label:'Metas', ic:'🎯'}
  ].map(t=>`<button class="tabbar-btn ${state.ui.tab===t.id?'active':''}" aria-label="${t.label}" onclick="state.ui.tab='${t.id}';save();render();"><span class="ic">${t.ic}</span>${t.label}</button>`).join('');

  const app = document.getElementById('app');
  app.classList.remove('view-enter');
  switch(state.ui.tab){
    case 'cuentas': app.innerHTML = viewCuentas(); break;
    case 'movimientos': app.innerHTML = viewMovimientos(); break;
    case 'transferir': app.innerHTML = viewTransferir(); break;
    case 'estadisticas': app.innerHTML = viewEstadisticas(); setTimeout(renderEstadisticasCharts, 0); break;
    case 'asistente': app.innerHTML = viewAsistente(); break;
    case 'metas': app.innerHTML = viewMetas(); break;
    case 'ajustes': app.innerHTML = viewAjustes(); break;
    default:
      app.innerHTML = viewInicio();
      maybeAutoGenerateInsight();
      scheduleWelcomeFadeOut();
  }
  void app.offsetWidth; // reiniciar animación
  app.classList.add('view-enter');
  if(typeof window.refreshLiquidGlass === 'function') window.refreshLiquidGlass();
}

/* El banner de bienvenida se desvanece solo a los pocos segundos,
   dejando ver el dashboard completo debajo sin que el usuario tenga
   que interactuar. Se marca en sessionStorage para no repetirse
   cada vez que se vuelve a la pestaña Inicio en la misma sesión. */
function scheduleWelcomeFadeOut(){
  const banner = document.getElementById('welcome_banner');
  if(!banner) return;
  setTimeout(()=>{
    banner.classList.add('animate-fadeOutUp');
    sessionStorage.setItem('welcomeShown', '1');
    setTimeout(()=>{ if(banner) banner.style.display = 'none'; }, 550);
  }, 2200);
}

/* Genera automáticamente el análisis al entrar a Inicio, salvo que ya haya
   uno reciente en el state (para no repetir pedidos innecesarios). */
function maybeAutoGenerateInsight(){
  const cfg = state.aiConfig;
  const hasKey = cfg.provider === 'gemini' ? !!cfg.geminiApiKey : !!cfg.apiKey;
  if(!hasKey) return;
  const ins = state.aiInsight;
  const FRESH_MS = 10 * 60 * 1000; // 10 minutos
  if(ins.loading) return;
  if(ins.text && (Date.now() - (ins.generatedAt||0)) < FRESH_MS) return;
  generateDashboardInsight(false);
}

function generateDashboardInsight(forced){
  state.aiInsight.loading = true;
  state.aiInsight.error = '';
  if(state.ui.tab === 'inicio'){
    const box = document.getElementById('ai_dashboard_block');
    if(box) box.outerHTML = `<div id="ai_dashboard_block">${aiAssistantBlockHtml()}</div>`;
  }

  const context = buildAIContext();
  const prompt = context + `\n\nDame un análisis súper breve (2-3 oraciones cortas, como un mensaje de chat) y personalizado de mi situación financiera actual, con 1 recomendación concreta. Usá 2 o 3 emojis para darle onda, pero sin markdown ni asteriscos ni listas numeradas — puro texto plano, natural y directo.` + JSON_MENSAJE_INSTRUCTION;

  callAI(prompt)
    .then(answer=>{
      state.aiInsight = { text: answer, loading:false, error:'', generatedAt: Date.now() };
      save();
      if(state.ui.tab==='inicio') render();
    })
    .catch(err=>{
      state.aiInsight = { text:'', loading:false, error: aiErrorMessage(err), generatedAt: Date.now() };
      save();
      if(state.ui.tab==='inicio') render();
    });
}

/* Devuelve la lista de transacciones ya filtrada según búsqueda + filtros
   combinados guardados en state.ui. Se usa tanto para el render inicial
   como para el refiltrado en vivo mientras se escribe en el buscador. */
function movimientosFiltradosList(){
  const filtroAcc = state.ui.movFilterAcc || 'todas';
  const filtroCat = state.ui.movFilterCat || 'todas';
  const filtroTipo = state.ui.movFilterTipo || 'todas';
  const desde = state.ui.movFilterDesde || '';
  const hasta = state.ui.movFilterHasta || '';
  const q = (state.ui.movSearch || '').trim().toLowerCase();

  let sorted = [...state.transactions].sort((a,b)=>b.ts-a.ts);
  if(filtroAcc !== 'todas') sorted = sorted.filter(t=>t.accountId===filtroAcc);
  if(filtroCat !== 'todas') sorted = sorted.filter(t=>t.category===filtroCat);
  if(filtroTipo !== 'todas') sorted = sorted.filter(t=>t.type===filtroTipo);
  if(desde) sorted = sorted.filter(t=>t.date >= desde);
  if(hasta) sorted = sorted.filter(t=>t.date <= hasta);
  if(q){
    sorted = sorted.filter(t=>{
      const cat = catInfo(t.category);
      const haystack = [t.note||'', cat.label||'', String(Math.round(t.amount))].join(' ').toLowerCase();
      return haystack.includes(q);
    });
  }
  return sorted;
}
function movimientosFiltradosHtml(){
  const sorted = movimientosFiltradosList();
  return sorted.length ? sorted.map(txRowHtml).join('') : `<div class="text-[13px] text-[#8E8E93] text-center py-4">Sin transacciones para este filtro.</div>`;
}

/* ---------- Calendario ---------- */
function calendarMonthLabel(mesKey){
  const [y,m] = mesKey.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('es-PY', {month:'long', year:'numeric'});
}
function navCalendarMonth(delta){
  const cur = state.ui.calMes || currentMonthKey();
  const [y,m] = cur.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  state.ui.calMes = d.toISOString().slice(0,7);
  state.ui.calDiaSel = null;
  save(); render();
}
function selectCalDia(iso){
  state.ui.calDiaSel = (state.ui.calDiaSel === iso) ? null : iso;
  save(); render();
}
function movimientosPorDia(iso){
  return state.transactions.filter(t=>t.date===iso).sort((a,b)=>b.ts-a.ts);
}
function resumenDiaHtml(iso){
  const movs = movimientosPorDia(iso);
  const ingresos = movs.filter(t=>t.type==='ingreso' && t.category!=='ajuste').reduce((s,t)=>s+t.amount,0);
  const gastos = movs.filter(t=>t.type==='gasto' && t.category!=='ajuste' && t.category!=='ahorro').reduce((s,t)=>s+t.amount,0);
  return `
  <div class="card p-3 mb-3">
    <div class="text-[13px] font-bold mb-2 capitalize">${fmtDate(iso)}</div>
    <div class="grid grid-cols-2 gap-2.5 mb-3">
      <div class="text-center">
        <div class="text-[10.5px] text-[#8E8E93] font-semibold">INGRESOS</div>
        <div class="font-mono font-bold text-[15px] text-[#30D158]">${fmt(ingresos)}</div>
      </div>
      <div class="text-center">
        <div class="text-[10.5px] text-[#8E8E93] font-semibold">GASTOS</div>
        <div class="font-mono font-bold text-[15px] text-[#FF453A]">${fmt(gastos)}</div>
      </div>
    </div>
    ${movs.length ? movs.map(txRowHtml).join('') : `<div class="text-[13px] text-[#8E8E93] text-center py-3">Sin movimientos este día.</div>`}
  </div>`;
}
function calendarioHtml(){
  const mesKey = state.ui.calMes || currentMonthKey();
  const [y,m] = mesKey.split('-').map(Number);
  const diasEnMes = daysInMonth(y, m-1);
  const primerDia = new Date(y, m-1, 1);
  const offset = (primerDia.getDay() + 6) % 7; // 0 = lunes
  const diaSel = state.ui.calDiaSel;
  const hoy = todayISO();
  const fechasConMov = new Set(state.transactions.filter(t=>t.date.slice(0,7)===mesKey).map(t=>t.date));

  let celdas = '';
  for(let i=0;i<offset;i++) celdas += `<div></div>`;
  for(let d=1; d<=diasEnMes; d++){
    const iso = `${mesKey}-${String(d).padStart(2,'0')}`;
    const tieneMov = fechasConMov.has(iso);
    const esHoy = iso === hoy;
    const esSel = iso === diaSel;
    celdas += `
    <div onclick="selectCalDia('${iso}')" class="flex flex-col items-center justify-center py-2 rounded-xl cursor-pointer ${esSel ? 'bg-[#0A84FF] text-white' : esHoy ? 'bg-[rgba(10,132,255,0.12)]' : ''}">
      <span class="text-[13px] font-semibold">${d}</span>
      ${tieneMov ? `<span class="w-1 h-1 rounded-full mt-0.5 ${esSel ? 'bg-white' : 'bg-[#0A84FF]'}"></span>` : `<span class="w-1 h-1 mt-0.5"></span>`}
    </div>`;
  }

  return `
  <div class="card p-3 mb-3">
    <div class="flex justify-between items-center mb-3">
      <button class="btn btn-outline btn-sm" onclick="navCalendarMonth(-1)">‹</button>
      <span class="font-serif font-bold text-[15px] capitalize">${calendarMonthLabel(mesKey)}</span>
      <button class="btn btn-outline btn-sm" onclick="navCalendarMonth(1)">›</button>
    </div>
    <div class="grid grid-cols-7 gap-1 mb-1.5 text-center text-[10.5px] font-bold text-[#8E8E93]">
      <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
    </div>
    <div class="grid grid-cols-7 gap-1">${celdas}</div>
  </div>
  ${diaSel ? resumenDiaHtml(diaSel) : `<div class="text-[13px] text-[#8E8E93] text-center py-3">Tocá un día para ver el detalle.</div>`}`;
}

function submitTransfer(e){
  e.preventDefault();
  clearFieldErrors(e.target);
  const fromId = document.getElementById('tr_from').value;
  const toId = document.getElementById('tr_to').value;
  const check = validatePositiveAmount('tr_amount');
  if(!check.ok) return false;
  if(fromId === toId){ showFieldError('tr_amount','El origen y el destino no pueden ser la misma cuenta.'); return false; }
  if(addTransfer({fromId, toId, amount: check.value})) {
    toast('¡Transferencia realizada! 🔁');
    render();
  }
  return false;
}

function renderEstadisticasCharts(){
  if(typeof Chart === 'undefined') return; // sin conexión, el CDN no cargó
  Object.values(_statsCharts).forEach(c => c && c.destroy());
  _statsCharts = {};

  const isDark = state.settings.theme === 'dark';
  const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
  const textColor = isDark ? '#98989F' : '#6B6B70';
  Chart.defaults.font.family = "'IBM Plex Sans', sans-serif";
  Chart.defaults.color = textColor;

  // ---- Línea: evolución del patrimonio ----
  const elPatr = document.getElementById('chart_patrimonio');
  if(elPatr){
    const puntos = getEvolucionPatrimonio(6);
    _statsCharts.patrimonio = new Chart(elPatr, {
      type: 'line',
      data: {
        labels: puntos.map(p=>p.label),
        datasets: [{
          data: puntos.map(p=>p.total),
          borderColor: '#0A84FF',
          backgroundColor: 'rgba(10,132,255,0.12)',
          fill: true, tension: 0.35, pointRadius: 3, pointBackgroundColor: '#0A84FF'
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx)=>fmt(ctx.parsed.y) } } },
        scales: {
          y: { grid: { color: gridColor }, ticks: { callback: (v)=>state.settings.currency+' '+Math.round(v/1000)+'k' } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  // ---- Torta: gastos por categoría ----
  const elCat = document.getElementById('chart_categorias');
  if(elCat){
    const map = getGastosPorCategoriaMes();
    const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]);
    const palette = ['#0A84FF','#FF453A','#FF9F0A','#30D158','#BF5AF2','#FF375F','#FFD60A','#64D2FF','#8E8E93'];
    if(entries.length){
      _statsCharts.categorias = new Chart(elCat, {
        type: 'doughnut',
        data: {
          labels: entries.map(([catId])=>`${catInfo(catId).icon} ${catInfo(catId).label}`),
          datasets: [{ data: entries.map(([,v])=>v), backgroundColor: entries.map((_,i)=>palette[i%palette.length]), borderWidth: 0 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10.5 } } },
            tooltip: { callbacks: { label: (ctx)=> ctx.label + ': ' + fmt(ctx.parsed) } }
          }
        }
      });
    } else {
      elCat.parentElement.innerHTML = `<div class="text-[13px] text-[#8E8E93] text-center py-4">Sin gastos este mes todavía.</div>`;
    }
  }

  // ---- Barras: comparativa entre meses ----
  const elComp = document.getElementById('chart_comparativa');
  if(elComp){
    const data = getComparativaMeses(6);
    _statsCharts.comparativa = new Chart(elComp, {
      type: 'bar',
      data: {
        labels: data.map(d=>d.label),
        datasets: [
          { label: 'Ingresos', data: data.map(d=>d.ingresos), backgroundColor: '#30D158', borderRadius: 4 },
          { label: 'Gastos', data: data.map(d=>d.gastos), backgroundColor: '#FF453A', borderRadius: 4 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10.5 } } },
          tooltip: { callbacks: { label: (ctx)=> ctx.dataset.label + ': ' + fmt(ctx.parsed.y) } }
        },
        scales: {
          y: { grid: { color: gridColor }, ticks: { callback: (v)=>state.settings.currency+' '+Math.round(v/1000)+'k' } },
          x: { grid: { display: false } }
        }
      }
    });
  }
}

/* ---------- Presupuestos: HTML ---------- */
function budgetsHtml(){
  const entries = Object.keys(state.budgets || {});
  return `
  ${sectionTitle('💰 Presupuestos', '+ definir', 'openSetBudget()', true)}
  <div class="card p-3">
    ${entries.length===0 ? `<div class="text-[13px] text-[#8E8E93] text-center py-4">Todavía no definiste presupuestos por categoría.</div>` : entries.map(catId=>{
      const cat = catInfo(catId);
      const p = getBudgetProgreso(catId);
      const pctBar = Math.min(100, p.pct);
      const color = p.pct<80 ? '#30D158' : p.pct<100 ? '#FF9F0A' : '#FF453A';
      const periodoLabel = p.period === 'semanal' ? 'semana' : 'mes';

      // Alerta al 80% / 90% / 100%+
      let alerta = '';
      if(p.pct >= 100){
        alerta = `<div class="flex gap-2 items-start p-2.5 rounded-xl text-[12px] leading-relaxed mt-2 ${insightClasses('rust')}"><span>🚨</span><span>Superaste el presupuesto de ${periodoLabel} en ${fmt(Math.abs(p.restante))}.</span></div>`;
      } else if(p.pct >= 90){
        alerta = `<div class="flex gap-2 items-start p-2.5 rounded-xl text-[12px] leading-relaxed mt-2 ${insightClasses('rust')}"><span>⚠️</span><span>Ya usaste el ${Math.round(p.pct)}% del presupuesto de ${periodoLabel}.</span></div>`;
      } else if(p.pct >= 80){
        alerta = `<div class="flex gap-2 items-start p-2.5 rounded-xl text-[12px] leading-relaxed mt-2 ${insightClasses('mustard')}"><span>⚠️</span><span>Ya usaste el ${Math.round(p.pct)}% del presupuesto de ${periodoLabel}.</span></div>`;
      } else if(p.superara){
        alerta = `<div class="flex gap-2 items-start p-2.5 rounded-xl text-[12px] leading-relaxed mt-2 ${insightClasses('mustard')}"><span>📈</span><span>Al ritmo actual (${fmt(p.velocidadDiaria)}/día) vas a terminar gastando ~${fmt(p.proyeccionFinal)}, por encima del límite.</span></div>`;
      }

      const mensaje = p.pct < 100
        ? `Te quedan ${fmt(p.restante)} para ${p.diasRestantes} día${p.diasRestantes===1?'':'s'} (promedio ${fmt(p.velocidadDiaria)}/día)`
        : `Llevás ${fmt(p.velocidadDiaria)}/día de promedio en lo que va del ${periodoLabel}`;

      return `
      <div class="py-3 border-b border-black/[0.05] dark:border-white/[0.07] last:border-b-0">
        <div class="flex justify-between items-center mb-1.5 gap-2">
          <span class="font-semibold text-sm">${cat.icon} ${cat.label} <span class="text-[10px] font-bold uppercase text-[#8E8E93]">· ${p.period === 'semanal' ? 'semanal' : 'mensual'}</span></span>
          <span class="font-mono font-semibold text-[13px]">${fmt(p.gastado)} / ${fmt(p.amount)}</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pctBar}%; background:${color};"></div></div>
        <div class="text-[11.5px] text-[#8E8E93] mt-1.5">${mensaje}</div>
        ${alerta}
        <div class="flex gap-2 mt-2">
          <button class="btn btn-sm btn-outline" onclick="openSetBudget('${catId}')">✏️ Editar</button>
          <button class="btn btn-sm btn-danger" onclick="deleteBudget('${catId}')">🗑 Quitar</button>
        </div>
      </div>`;
    }).join('')}
  </div>
  <button class="btn btn-ai btn-sm mt-2.5" onclick="openBudgetAIHelp()">✨ Ayudame a definir presupuestos con IA</button>`;
}

function openSetBudget(catId){
  const existing = catId ? normalizeBudget(catId) : null;
  const current = existing ? existing.amount : '';
  const period = existing ? existing.period : 'mensual';
  openModal(`
    <h3 class="text-base mb-4 flex justify-between items-center font-serif">💰 ${catId ? 'Editar' : 'Definir'} Presupuesto ${closeBtn('closeModal()')}</h3>
    <form onsubmit="return submitSetBudget(event, ${catId ? `'${catId}'` : 'null'})">
      <div class="field mb-3.5">
        <label for="bg_cat">Categoría</label>
        ${catId
          ? `<div class="ios-select-btn" style="cursor:default;"><span>${catInfo(catId).icon} ${catInfo(catId).label}</span></div><input type="hidden" id="bg_cat" value="${catId}">`
          : iosSelect('bg_cat', catOptionsWithNew('gasto'), EXPENSE_CATS[0].id, "handleCatSelectChange('bg_cat','gasto')")}
      </div>
      <div class="field mb-3.5">
        <label for="bg_period">Período</label>
        ${iosSelect('bg_period', [{value:'mensual', label:'📅 Mensual'},{value:'semanal', label:'🗓️ Semanal'}], period)}
      </div>
      <div class="field mb-3.5"><label for="bg_amount">Monto del período</label>${iosNumpad('bg_amount', current, {allowDecimals:true})}</div>
      <button class="btn btn-primary" type="submit">Guardar Presupuesto</button>
    </form>
  `);
}
function submitSetBudget(e, fixedCatId){
  e.preventDefault();
  clearFieldErrors(e.target);
  const catId = fixedCatId || document.getElementById('bg_cat').value;
  const period = document.getElementById('bg_period').value;
  const check = validatePositiveAmount('bg_amount');
  if(!check.ok) return false;
  setBudget(catId, check.value, period);
  closeModal(); render(); toast('Presupuesto guardado 💰');
  return false;
}

/* ---------- Gráfico de gastos por categoría (barras) ---------- */
function categoriaChartHtml(){
  const map = getGastosPorCategoriaMes();
  const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((s,[,v])=>s+v,0);
  if(!entries.length) return `<div class="text-[13px] text-[#8E8E93] text-center py-4">Sin gastos este mes todavía.</div>`;
  return entries.map(([catId,val])=>{
    const cat = catInfo(catId);
    const pct = total>0 ? Math.round((val/total)*100) : 0;
    return `
    <div class="mb-3 last:mb-0">
      <div class="text-[12.5px] font-semibold mb-1">${cat.icon} ${cat.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:#0A84FF;"></div></div>
      <div class="text-[11px] text-[#8E8E93] mt-0.5 text-right">${fmt(val)} · ${pct}%</div>
    </div>`;
  }).join('');
}

/* Diagnóstico de conexión: muestra el error crudo en pantalla (sin depender
   de la consola del navegador), útil para depurar en el celular. Usa la
   configuración que está tipeada en el formulario en ese momento, aunque
   todavía no se haya guardado. */
function testAIConnection(){
  const box = document.getElementById('ai_test_result');
  box.innerHTML = `<div class="text-[12.5px] text-[#8E8E93] mt-2.5">🔍 Probando conexión...</div>`;

  const provider = document.getElementById('ai_provider').value;
  let url, options;

  if(provider === 'gemini'){
    const key = document.getElementById('ai_gemini_key').value.trim();
    const model = document.getElementById('ai_gemini_model').value.trim() || 'gemini-2.0-flash';
    if(!key){ box.innerHTML = `<div class="text-[12.5px] mt-2.5 ${insightClasses('rust')} p-2.5 rounded-xl">Falta la clave de API de Gemini.</div>`; return; }
    url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
    options = { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ contents:[{role:'user', parts:[{text:'di "ok" y nada más'}]}] }) };
  } else {
    const key = document.getElementById('ai_key').value.trim();
    const apiUrl = document.getElementById('ai_url').value.trim() || 'https://api.openai.com/v1/chat/completions';
    const model = document.getElementById('ai_model').value.trim() || 'gpt-4o-mini';
    if(!key){ box.innerHTML = `<div class="text-[12.5px] mt-2.5 ${insightClasses('rust')} p-2.5 rounded-xl">Falta la clave de API.</div>`; return; }
    url = apiUrl;
    options = { method:'POST', headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+key}, body: JSON.stringify({ model, messages:[{role:'user', content:'di "ok" y nada más'}] }) };
  }

  const startedAt = Date.now();
  fetch(url, options)
    .then(async r=>{
      const elapsed = Date.now()-startedAt;
      const bodyText = await r.text().catch(()=> '(no se pudo leer el cuerpo)');
      if(!r.ok){
        box.innerHTML = `<div class="text-[12px] mt-2.5 ${insightClasses('rust')} p-2.5 rounded-xl leading-relaxed"><b>HTTP ${r.status}</b> (${elapsed}ms)<br>${escapeHtml(bodyText.slice(0,400))}</div>`;
        return;
      }
      box.innerHTML = `<div class="text-[12px] mt-2.5 ${insightClasses('green')} p-2.5 rounded-xl leading-relaxed"><b>✅ Conexión OK</b> (${elapsed}ms)<br>${escapeHtml(bodyText.slice(0,300))}</div>`;
    })
    .catch(err=>{
      const elapsed = Date.now()-startedAt;
      const detail = `nombre: ${err && err.name}, mensaje: ${err && err.message}`;
      box.innerHTML = `<div class="text-[12px] mt-2.5 ${insightClasses('rust')} p-2.5 rounded-xl leading-relaxed">
        <b>❌ Falló antes de llegar al servidor</b> (${elapsed}ms)<br>
        ${escapeHtml(detail)}<br><br>
        <b>URL usada:</b> ${escapeHtml(url.replace(/key=[^&]+/, 'key=***'))}<br><br>
        Esto suele ser: sin conexión a internet en este momento, un bloqueador/VPN/DNS privado cortando la petición, o el navegador tratando esta página como origen inseguro. No es un error de tu clave ni del modelo.
      </div>`;
    });
}

/* ---------- Exportar reportes (CSV / Excel / PDF) ---------- */
function movimientosEnRango(desde, hasta){
  return state.transactions
    .filter(t => (!desde || t.date >= desde) && (!hasta || t.date <= hasta))
    .sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
}
function filaMovimientoExport(t){
  return {
    Fecha: t.date,
    Tipo: t.type==='ingreso' ? 'Ingreso' : t.type==='gasto' ? 'Gasto' : 'Transferencia',
    Categoría: catInfo(t.category).label,
    Cuenta: (getAccount(t.accountId)||{}).name || '',
    Monto: t.amount,
    Nota: t.note || ''
  };
}
function openExportModal(){
  const primerMov = state.transactions.reduce((min,t)=> (!min || t.date<min) ? t.date : min, null);
  openModal(`
    <h3 class="text-base mb-4 flex justify-between items-center font-serif">📤 Exportar Reporte ${closeBtn('closeModal()')}</h3>
    <p class="text-[12px] text-[#8E8E93] mb-3.5">Elegí el rango de fechas y el formato. Si no cambiás las fechas, se exporta todo el historial.</p>
    <div class="grid grid-cols-2 gap-2.5 mb-3.5">
      <div class="field mb-0"><label for="exp_desde">Desde</label><input type="date" id="exp_desde" value="${primerMov || ''}"></div>
      <div class="field mb-0"><label for="exp_hasta">Hasta</label><input type="date" id="exp_hasta" value="${todayISO()}"></div>
    </div>
    <div class="flex flex-col gap-2.5">
      <button class="btn btn-outline" onclick="exportCSV()">📄 Exportar CSV</button>
      <button class="btn btn-outline" onclick="exportExcel()">📊 Exportar Excel (.xlsx)</button>
      <button class="btn btn-outline" onclick="exportPDF()">🧾 Exportar PDF (con gráfico)</button>
    </div>
  `);
}
function exportCSV(){
  const desde = document.getElementById('exp_desde').value;
  const hasta = document.getElementById('exp_hasta').value;
  const movs = movimientosEnRango(desde, hasta);
  if(!movs.length){ toast('No hay movimientos en ese rango.'); return; }
  const header = ['Fecha','Tipo','Categoría','Cuenta','Monto','Nota'];
  const filas = movs.map(t => {
    const f = filaMovimientoExport(t);
    return [f.Fecha, f.Tipo, f.Categoría, f.Cuenta, f.Monto, f.Nota];
  });
  const csv = [header, ...filas]
    .map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))
    .join('\n');
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `movimientos_${desde||'inicio'}_a_${hasta||todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  closeModal(); toast('CSV exportado 📄');
}
function exportExcel(){
  if(typeof XLSX === 'undefined'){ toast('No se pudo cargar el motor de Excel. Revisá tu conexión a internet.'); return; }
  const desde = document.getElementById('exp_desde').value;
  const hasta = document.getElementById('exp_hasta').value;
  const movs = movimientosEnRango(desde, hasta);
  if(!movs.length){ toast('No hay movimientos en ese rango.'); return; }
  const ws = XLSX.utils.json_to_sheet(movs.map(filaMovimientoExport));
  ws['!cols'] = [{wch:11},{wch:14},{wch:18},{wch:16},{wch:14},{wch:30}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Movimientos');
  XLSX.writeFile(wb, `movimientos_${desde||'inicio'}_a_${hasta||todayISO()}.xlsx`);
  closeModal(); toast('Excel exportado 📊');
}
function exportPDF(){
  if(typeof window.jspdf === 'undefined'){ toast('No se pudo cargar el motor de PDF. Revisá tu conexión a internet.'); return; }
  const desde = document.getElementById('exp_desde').value;
  const hasta = document.getElementById('exp_hasta').value;
  const movs = movimientosEnRango(desde, hasta);
  if(!movs.length){ toast('No hay movimientos en ese rango.'); return; }

  const gastosPorCat = {};
  movs.filter(t=>t.type==='gasto' && t.category!=='ajuste' && t.category!=='ahorro')
      .forEach(t=>{ gastosPorCat[t.category] = (gastosPorCat[t.category]||0) + t.amount; });
  const entries = Object.entries(gastosPorCat).sort((a,b)=>b[1]-a[1]);

  const construirPdf = (chartImg) => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(16); doc.setTextColor(20); doc.text('Mi Libreta — Reporte de movimientos', 14, 18);
    doc.setFontSize(10); doc.setTextColor(120);
    doc.text(`Período: ${desde || 'inicio del historial'} a ${hasta || todayISO()}`, 14, 25);

    const totalIngresos = movs.filter(t=>t.type==='ingreso' && t.category!=='ajuste').reduce((s,t)=>s+t.amount,0);
    const totalGastos = movs.filter(t=>t.type==='gasto' && t.category!=='ajuste' && t.category!=='ahorro').reduce((s,t)=>s+t.amount,0);
    doc.setFontSize(11); doc.setTextColor(0);
    doc.text(`Ingresos: ${fmt(totalIngresos)}`, 120, 38);
    doc.text(`Gastos: ${fmt(totalGastos)}`, 120, 45);
    doc.text(`Balance: ${fmt(totalIngresos - totalGastos)}`, 120, 52);

    let y = 34;
    if(chartImg){ doc.addImage(chartImg, 'PNG', 14, y, 95, 65); y += 72; }
    else { y = 58; }

    doc.autoTable({
      startY: Math.max(y, 62),
      head: [['Fecha','Tipo','Categoría','Cuenta','Monto','Nota']],
      body: movs.map(t => { const f = filaMovimientoExport(t); return [f.Fecha, f.Tipo, f.Categoría, f.Cuenta, fmt(f.Monto), f.Nota]; }),
      styles: { fontSize: 8 },
      headStyles: { fillColor: [10,132,255] }
    });
    doc.save(`movimientos_${desde||'inicio'}_a_${hasta||todayISO()}.pdf`);
    closeModal(); toast('PDF exportado 🧾');
  };

  // Si Chart.js está disponible, dibujamos un gráfico de gastos por categoría
  // en un canvas oculto para incrustarlo como imagen en el PDF.
  if(!entries.length || typeof Chart === 'undefined'){ construirPdf(null); return; }
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = 500; tmpCanvas.height = 340;
  tmpCanvas.style.position = 'fixed'; tmpCanvas.style.left = '-9999px';
  document.body.appendChild(tmpCanvas);
  const palette = ['#0A84FF','#FF453A','#FF9F0A','#30D158','#BF5AF2','#FF375F','#FFD60A','#64D2FF','#8E8E93'];
  const tmpChart = new Chart(tmpCanvas, {
    type: 'doughnut',
    data: {
      labels: entries.map(([catId])=>catInfo(catId).label),
      datasets: [{ data: entries.map(([,v])=>v), backgroundColor: entries.map((_,i)=>palette[i%palette.length]) }]
    },
    options: { responsive:false, animation:false, plugins:{ legend:{ position:'bottom', labels:{font:{size:10}} } } }
  });
  setTimeout(()=>{
    const img = tmpCanvas.toDataURL('image/png');
    tmpChart.destroy();
    document.body.removeChild(tmpCanvas);
    construirPdf(img);
  }, 300);
}

/* Fusiona un objeto de estado importado (desde JSON local o desde Google
   Drive) con los valores por defecto, igual que hace load() al arrancar.
   Centralizado acá para no duplicar esta lógica entre importData() y
   restoreFromDrive(). */
function applyImportedState(parsed){
  if(!parsed.accounts || !Array.isArray(parsed.accounts)) throw new Error('Formato inválido');
  const base = defaultState();
  state = {
    ...base, ...parsed,
    settings: {...base.settings, ...(parsed.settings||{})},
    ui: {...base.ui, ...(parsed.ui||{})},
    budgets: {...(parsed.budgets||{})},
    customCategories: Array.isArray(parsed.customCategories) ? parsed.customCategories : [],
    aiConfig: {...base.aiConfig, ...(parsed.aiConfig||{})},
    aiInsight: {...base.aiInsight, ...(parsed.aiInsight||{}), loading:false},
    onboardingDone: parsed.onboardingDone === true
  };
}
function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if(!parsed.accounts || !Array.isArray(parsed.accounts)) throw new Error('Formato inválido');
      if(!confirm('Esto va a reemplazar todos tus datos actuales. ¿Continuar?')) return;
      applyImportedState(parsed);
      save(); render();
      toast('Datos importados ✅');
    } catch(err){
      alert('No se pudo importar: el archivo no tiene un formato válido.');
    }
  };
  reader.readAsText(file);
}

/* ---------- Copia de seguridad en Google Drive ----------
   Usa Google Identity Services (OAuth en el navegador, sin backend) y
   la carpeta oculta "appDataFolder" de Drive, que es privada para esta
   app y no aparece en el Drive visible del usuario.

   IMPORTANTE — limitación real si esto se empaqueta como APK: Google
   bloquea el login de OAuth dentro de WebViews "embebidos" genéricos
   (el típico wrapper de "convertí tu web en APK"), y va a fallar con
   un error de "browser inseguro". Para que este botón funcione en una
   APK hace falta empaquetar con una Trusted Web Activity (TWA, por
   ejemplo con Bubblewrap o PWABuilder), que usa Chrome de verdad por
   detrás. En un navegador normal (Chrome, Safari, Edge) funciona sin
   problema. */
let _gTokenClient = null;
let _gAccessToken = null;

function initGoogleTokenClient(){
  if(typeof google === 'undefined' || !google.accounts) return null;
  if(!state.settings.googleClientId) return null;
  if(!_gTokenClient || _gTokenClient._clientId !== state.settings.googleClientId){
    _gTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: state.settings.googleClientId,
      scope: 'https://www.googleapis.com/auth/drive.appdata',
      callback: ''
    });
    _gTokenClient._clientId = state.settings.googleClientId;
  }
  return _gTokenClient;
}
function conectarGoogleDrive(){
  if(!state.settings.googleClientId){ toast('Primero pegá tu Google Client ID acá abajo.'); return; }
  if(typeof google === 'undefined' || !google.accounts){ toast('No se pudo cargar Google. Revisá tu conexión a internet.'); return; }
  const client = initGoogleTokenClient();
  if(!client) return;
  client.callback = (resp) => {
    if(resp.error){ toast('No se pudo conectar con Google Drive.'); return; }
    _gAccessToken = resp.access_token;
    toast('Conectado a Google Drive ✅');
    render();
  };
  client.requestAccessToken({ prompt: 'consent' });
}
async function buscarArchivoDrive(){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${encodeURIComponent("name='mi_libreta_backup.json'")}&fields=files(id,name)`, {
    headers: { 'Authorization': `Bearer ${_gAccessToken}` }
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}
/* Si el token venció (Google los vence a la hora), pide uno nuevo sin
   mostrar la pantalla de consentimiento (prompt:'') y reintenta la
   operación una sola vez. Si igual falla, recién ahí se avisa al usuario. */
function reconectarSilencioso(){
  return new Promise((resolve) => {
    const client = initGoogleTokenClient();
    if(!client){ resolve(false); return; }
    client.callback = (resp) => {
      if(resp.error){ resolve(false); return; }
      _gAccessToken = resp.access_token;
      resolve(true);
    };
    client.requestAccessToken({ prompt: '' });
  });
}
async function backupToDrive(){
  if(!_gAccessToken){ toast('Conectate a Google Drive primero.'); return; }
  try {
    await _backupToDriveIntentar();
  } catch(e){
    if(String(e.message).includes('HTTP 401') && await reconectarSilencioso()){
      try { await _backupToDriveIntentar(); return; } catch(e2){ toast('Error al respaldar en Drive: ' + e2.message); return; }
    }
    toast('Error al respaldar en Drive: ' + e.message);
  }
}
async function _backupToDriveIntentar(){
  const fileId = await buscarArchivoDrive();
  const contenido = JSON.stringify(state);
  const metadata = fileId ? { name: 'mi_libreta_backup.json' } : { name: 'mi_libreta_backup.json', parents: ['appDataFolder'] };
  const boundary = 'milibreta' + Date.now();
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${contenido}\r\n--${boundary}--`;
  const url = fileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  const res = await fetch(url, {
    method: fileId ? 'PATCH' : 'POST',
    headers: { 'Authorization': `Bearer ${_gAccessToken}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  state.settings.ultimoRespaldoDrive = new Date().toISOString();
  save(); render();
  toast('Respaldo guardado en Google Drive ☁️');
}
async function restoreFromDrive(){
  if(!_gAccessToken){ toast('Conectate a Google Drive primero.'); return; }
  if(!confirm('Esto va a reemplazar los datos de este dispositivo con el último respaldo de Drive. ¿Continuar?')) return;
  try {
    await _restoreFromDriveIntentar();
  } catch(e){
    if(String(e.message).includes('HTTP 401') && await reconectarSilencioso()){
      try { await _restoreFromDriveIntentar(); return; } catch(e2){ toast('Error al restaurar desde Drive: ' + e2.message); return; }
    }
    toast('Error al restaurar desde Drive: ' + e.message);
  }
}
async function _restoreFromDriveIntentar(){
  const fileId = await buscarArchivoDrive();
  if(!fileId){ toast('Todavía no hay ningún respaldo en tu Drive.'); return; }
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { 'Authorization': `Bearer ${_gAccessToken}` }
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const parsed = await res.json();
  applyImportedState(parsed);
  save(); render();
  toast('Datos restaurados desde Google Drive ☁️');
}

/* Reinicia completamente la app: borra localStorage, resetea el estado en
   memoria y vuelve a mostrar el onboarding (solo ahora, tras el reinicio). */
function resetAll(){
  if(!confirm('¿Seguro que querés borrar TODOS tus datos? Esta acción no se puede deshacer.')) return;
  if(!confirm('Confirmá de nuevo: se van a perder cuentas, movimientos, metas y gastos fijos.')) return;
  localStorage.removeItem(STORAGE_KEY);
  sessionStorage.removeItem('welcomeShown');
  state = defaultState();
  state.onboardingDone = false;
  applyTheme();
  save();
  closeModal();
  render();
  toast('App reiniciada 🔄');
  maybeShowOnboarding();
}

/* ============================================================

   ------------------------------------------------------------
   Se abre como una hoja flotante encima del modal actual (mismo
   patrón que el numpad y el ios-select: no cierra el formulario de
   fondo). Al guardar, arma la categoría, la agrega a
   state.customCategories, la selecciona automáticamente en el

   targetSelectId: id del <select> (input hidden) que debe quedar

   type: 'gasto' | 'ingreso' — determina en qué lista entra la
   categoría y qué emoji tiene sentido sugerir.
   ---------- */
function openCreateCategory(type, targetSelectId){
  const existing = document.getElementById('actionsheet-overlay');

  const wrap = document.createElement('div');
  wrap.id = 'actionsheet-overlay';
  wrap.className = 'fixed inset-0 z-[200] flex items-end justify-center';

  wrap.innerHTML = `

        </div>
        <div class="field mb-1">
          <label for="newcat_icon">Emoji</label>
          <div class="flex gap-2 items-center">
            <button type="button" class="icon-btn" style="width:52px;height:52px;font-size:24px;flex:none;" id="newcat_icon_btn">🗂️</button>
            <input type="hidden" id="newcat_icon" value="🗂️">
            <button type="button" class="btn btn-ai btn-sm" id="newcat_suggest_btn">✨ Sugerir con IA</button>
          </div>
          <div id="newcat_icon_hint" class="text-[11.5px] text-[#8E8E93] mt-1.5 leading-relaxed">Escribí el nombre y tocá "Sugerir con IA" para un emoji automático, o tocá el emoji para elegir otro.</div>
        </div>
      </div>
      <button type="button" class="btn btn-primary mb-2" id="newcat_save_btn">Crear categoría</button>
      <button type="button" class="ios-option-row cancel" id="newcat_cancel_btn">Cancelar</button>
    </div>`;
  document.body.appendChild(wrap);

  // Elegir emoji a mano: un set corto de opciones comunes, sin depender de IA.
  document.getElementById('newcat_icon_btn').addEventListener('click', ()=>{
    const common = ['🗂️','🐾','🏠','🚗','👕','🎮','📚','💇','🎁','🧴','⚽','🍺','✈️','🛠️','💊','🧒','🐶','🎵'];
    openIosPickList('Elegí un emoji', common.map(e=>({value:e,label:e})), document.getElementById('newcat_icon').value, (val)=>{
      document.getElementById('newcat_icon').value = val;
      document.getElementById('newcat_icon_btn').textContent = val;
    });
  });

  document.getElementById('newcat_suggest_btn').addEventListener('click', ()=> suggestCategoryEmoji(type));
  document.getElementById('newcat_save_btn').addEventListener('click', ()=> confirmCreateCategory(type, targetSelectId));
  document.getElementById('newcat_cancel_btn').addEventListener('click', ()=>{
    // Al cancelar, si el select quedó en "__new_cat__" lo devolvemos a la
    // primera opción real para no dejarlo en un valor inválido.
    revertNewCatSelection(targetSelectId, type);
    closeIosSelectSheet();
  });

  wrap.addEventListener('click', (e)=>{ if(e.target === wrap){ revertNewCatSelection(targetSelectId, type); closeIosSelectSheet(); } });
}

function revertNewCatSelection(targetSelectId, type){
  const hiddenInput = document.getElementById(targetSelectId);
  if(!hiddenInput) return;
  const cats = type === 'ingreso' ? incomeCats() : expenseCats();
  if(hiddenInput.value === '__new_cat__' && cats[0]){
    selectIosOption(targetSelectId, cats[0].id);
  }
}

/* Pide a la IA un único emoji acorde al nombre de la categoría que el
   usuario está escribiendo. Si no hay clave de IA configurada, cae en
   una lista de palabras clave locales para no dejar la función rota. */
function suggestCategoryEmoji(type){
  const nameInput = document.getElementById('newcat_name');
  const name = nameInput ? nameInput.value.trim() : '';
  if(!name){ nameInput && nameInput.focus(); return; }
  const btn = document.getElementById('newcat_suggest_btn');
  const hint = document.getElementById('newcat_icon_hint');
  const cfg = state.aiConfig;
  const hasKey = cfg.provider === 'gemini' ? !!cfg.geminiApiKey : !!cfg.apiKey;

  const applyEmoji = (emoji) => {
    document.getElementById('newcat_icon').value = emoji;
    const iconBtn = document.getElementById('newcat_icon_btn');
    if(iconBtn) iconBtn.textContent = emoji;
  };

  if(!hasKey){
    applyEmoji(guessEmojiLocally(name, type));
    if(hint) hint.textContent = 'Elegido automáticamente (configurá tu clave de IA en Ajustes para sugerencias más precisas).';
    return;
  }

  btn.disabled = true; btn.textContent = 'Pensando...';
  if(hint) hint.textContent = '';
  const prompt = `Dame UN SOLO emoji que represente mejor la categoría de ${type === 'ingreso' ? 'ingresos' : 'gastos'} llamada "${name}" para una app de finanzas personales. Respondé ÚNICAMENTE con el emoji, sin texto, sin explicación, sin comillas.`;
  callAI(prompt)
    .then(answer=>{
      const emoji = extractFirstEmoji(answer) || guessEmojiLocally(name, type);
      applyEmoji(emoji);
      if(hint) hint.textContent = '';
    })
    .catch(()=>{
      applyEmoji(guessEmojiLocally(name, type));
      if(hint) hint.textContent = 'No se pudo consultar la IA — se eligió un emoji automáticamente.';
    })
    .finally(()=>{
      btn.disabled = false; btn.textContent = '✨ Sugerir con IA';
    });
}

/* Extrae el primer emoji de la respuesta de la IA, por si igual manda
   texto alrededor pese a la instrucción de responder solo el emoji. */
function extractFirstEmoji(text){
  if(!text) return null;
  const match = text.match(/\p{Extended_Pictographic}/u);
  return match ? match[0] : null;
}

/* Adivina un emoji razonable por palabras clave, sin depender de la IA.
   Sirve tanto de respaldo (sin clave configurada) como si la IA falla. */
function guessEmojiLocally(name, type){
  const n = name.toLowerCase();
  const rules = [
    [/masc|perr|gat|veterinari/, '🐾'],
    [/ropa|vestimenta|calzado|zapat/, '👕'],
    [/casa|alquiler|hogar|muebl/, '🏠'],
    [/auto|carro|nafta|combustible|mecánic|mecanic/, '🚗'],
    [/gym|gimnasio|deporte|fitness/, '🏋️'],
    [/juego|gaming|videojuego/, '🎮'],
    [/libro|estudio|curso/, '📚'],
    [/peluquer|estétic|estetic|belleza/, '💇'],
    [/regalo|cumpleañ/, '🎁'],
    [/limpieza|higiene/, '🧴'],
    [/bar|cerveza|alcohol|boliche/, '🍺'],
    [/viaje|vuelo|pasaje/, '✈️'],
    [/repara|arregl|herramient/, '🛠️'],
    [/remedi|farmac|médic|medic/, '💊'],
    [/hij|beb[eé]|niñ/, '🧒'],
    [/músic|music|spotify/, '🎵'],
    [/suscripci[oó]n|streaming/, '📺'],
    [/inversi[oó]n|acci[oó]n|bolsa/, '📈'],
    [/freelance|proyecto|changa/, '🧾']
  ];
  for(const [re, emoji] of rules){ if(re.test(n)) return emoji; }
  return type === 'ingreso' ? '✨' : '🗂️';
}

function confirmCreateCategory(type, targetSelectId){

/* Mini action-sheet genérico de una sola columna de opciones, usado para
   elegir el emoji manualmente. onPick recibe el value elegido. */
function openIosPickList(title, options, currentValue, onPick){
  const existing = document.getElementById('pick-overlay');
  if(existing) existing.remove();
  const wrap = document.createElement('div');
  wrap.id = 'pick-overlay';
  wrap.className = 'fixed inset-0 z-[210] flex items-end justify-center';
  wrap.style.background = 'rgba(0,0,0,0.35)';
  wrap.innerHTML = `
    <div class="actionsheet w-full max-w-[480px] px-2 pb-2">
      <div class="card p-3 mb-2">
        <div class="text-[13px] font-bold text-[#8E8E93] mb-2 text-center">${escapeHtml(title)}</div>
        <div class="grid grid-cols-6 gap-1.5">
          ${options.map((o,i)=>`<button type="button" class="numpad-key" style="font-size:20px;padding:10px 0;" data-pick-index="${i}">${o.label}</button>`).join('')}
        </div>
      </div>
      <button type="button" class="ios-option-row cancel" id="pick-cancel-btn">Cancelar</button>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelectorAll('[data-pick-index]').forEach(btn=>{
    const o = options[Number(btn.getAttribute('data-pick-index'))];
    btn.addEventListener('click', ()=>{ onPick(o.value); wrap.remove(); });
  });
  document.getElementById('pick-cancel-btn').addEventListener('click', ()=> wrap.remove());
  wrap.addEventListener('click', (e)=>{ if(e.target === wrap) wrap.remove(); });
}

function submitAddAhorroMeta(ev, metaId) {
  ev.preventDefault();
  clearFieldErrors(ev.target);
  const check = validatePositiveAmount('ahorro_monto');
  if(!check.ok) return false;
  const accountId = document.getElementById('ahorro_cuenta').value;
  const meta = state.metasAhorro.find(m => m.id === metaId);

  // addTransaction ya resta el saldo de la cuenta. Si esa cuenta está
  // vinculada a esta meta, addTransaction también suma el progreso —
  // así que acá NO hay que tocar acc.balance ni currentAmount a mano
  // (antes se hacía dos veces: acá y dentro de addTransaction, lo que
  // dejaba saldos negativos falsos).
  addTransaction({ accountId, type: 'gasto', amount: check.value, category: 'ahorro', note: `Ahorro meta "${meta.name}"` });
  if(meta.linkedAccountId !== accountId){
    // Cuenta de origen distinta a la vinculada: el aporte sí cuenta para
    // el progreso de la meta, pero addTransaction no lo hizo porque esa
    // cuenta no es la vinculada.
    meta.currentAmount += check.value;
    registrarProgresoMeta(meta);
  }
  save();
  closeModal(); render(); toast(`¡Ahorraste ${fmt(check.value)}! 💪`);
  return false;
}

function buildAIContext(){
  const mk = currentMonthKey();
  const resumen = getResumenFinanciero();
  let txt = `Actuá como mi asesor financiero personal. Estos son mis datos actuales:\n\n`;

  txt += `CUENTAS:\n`;
  state.accounts.forEach(a => txt += `- ${a.name}: ${fmt(a.balance)}${a.apartada ? ' (apartada, no cuenta para gastos del día a día)' : ''}\n`);

  txt += `\nRESUMEN DEL MES:\n`;
  txt += `- Ingresos del mes: ${fmt(resumen.ingresosMes)}\n`;
  txt += `- Gastos fijos ya pagados este mes: ${fmt(resumen.gastosFijosMes)}\n`;
  txt += `- Gastos fijos pendientes (aún no pagados): ${fmt(resumen.gastosFijosPendientesMes)}\n`;
  txt += `- Gastos variables del mes: ${fmt(resumen.gastosVariables)}\n`;
  txt += `- Disponible para gastos variables (ya considerando, cuenta por cuenta, que cada gasto fijo sale de SU propia cuenta asignada, no de un pozo común): ${fmt(resumen.disponibleVariable)}\n`;
  if(resumen.cuentasEnRojo.length){
    txt += `- IMPORTANTE: las siguientes cuentas específicas no alcanzan a cubrir sus propios gastos (aunque otras cuentas estén bien): `;
    txt += resumen.cuentasEnRojo.map(c => `${c.name} (faltan ${fmt(c.faltante)})`).join(', ') + `\n`;
  } else {
    txt += `- Ninguna cuenta está en rojo: todas cubren sus propios gastos fijos y variables.\n`;
  }

  txt += `\nGASTOS DEL MES POR CATEGORÍA:\n`;
  const gastosPorCat = getGastosPorCategoriaMes();
  Object.entries(gastosPorCat).forEach(([catId,val]) => txt += `- ${catInfo(catId).label}: ${fmt(val)}\n`);

  if(Object.keys(state.budgets).length){
    txt += `\nPRESUPUESTOS DEFINIDOS:\n`;
    Object.keys(state.budgets).forEach(catId => {
      const p = getBudgetProgreso(catId);
      if(!p) return;
      txt += `- ${catInfo(catId).label}: presupuesto ${fmt(p.amount)} (${p.period}), gastado ${fmt(p.gastado)} en lo que va del período\n`;
    });
  }

  if(state.gastosFijos.length){
    // IMPORTANTE para la IA: cada gasto fijo se paga con SU PROPIA cuenta
    // asignada, no con un fondo común. Un gasto pendiente en una cuenta
    // con plata de sobra (ej: cuota de facultad ← cuenta Facultad) NO es
    // una alerta, aunque otra cuenta distinta esté en cero.
    txt += `\nGASTOS FIJOS (cada uno sale de SU cuenta asignada, no de un pozo común):\n`;
    state.gastosFijos.forEach(g => {
      const cuenta = getAccount(g.accountId);
      const estado = g.pagado && g.mesPagado===mk ? 'pagado' : 'pendiente';
      const infoCuenta = cuenta ? `se paga con la cuenta "${cuenta.name}" (saldo actual ${fmt(cuenta.balance)})` : 'sin cuenta de origen asignada';
      txt += `- ${g.name}: ${fmt(g.amount)} (día ${g.dueDay}, ${estado}, ${infoCuenta})\n`;
    });
  }

  if(state.metasAhorro.length){
    txt += `\nMETAS DE AHORRO:\n`;
    state.metasAhorro.forEach(m => txt += `- ${m.name}: ${fmt(m.currentAmount)} / ${fmt(m.targetAmount)}\n`);
  }

  return txt;
}

function generateAIPrompt() {
  const txt = buildAIContext();
  navigator.clipboard.writeText(txt).then(() => {
    toast('¡Prompt copiado al portapapeles! 📋');
  }).catch(() => prompt('Copiá este texto:', txt));
}

   chat para el usuario (análisis financiero, "Preguntar a la IA"). No se
   usa en los prompts de sugerencia de presupuesto ni de emoji, que ya
   piden su propio formato JSON/plano distinto. */
const JSON_MENSAJE_INSTRUCTION = '\n\nFORMATO DE RESPUESTA OBLIGATORIO: respondé ÚNICAMENTE con un objeto JSON válido, en una sola línea, con exactamente esta forma: {"mensaje": "acá va el texto final, sin markdown, como un chat de WhatsApp"}. No escribas nada antes ni después de ese JSON: nada de razonamiento, borradores, autoevaluación de reglas, ni bloques de código con acentos graves. Si el mensaje necesita un salto de línea, escapalo como \\n dentro del string. No repitas el JSON dos veces.';

/* Instrucción de formato para la carga de movimientos por lenguaje natural
   (ver openAddWithAI). Mismo criterio que JSON_MENSAJE_INSTRUCTION: JSON en
   una sola línea, y como algunos modelos "piensan en voz alta" y pueden citar
   este mismo formato como ejemplo dentro de su borrador, extractTransactionJSON
   busca el ÚLTIMO bloque { ... } válido, no el primero (mismo fix que en
   extractMensajeField). */
const JSON_TRANSACCION_INSTRUCTION = '\n\nFORMATO DE RESPUESTA OBLIGATORIO: respondé ÚNICAMENTE con un objeto JSON válido, en una sola línea, con exactamente esta forma: {"tipo":"gasto|ingreso","categoria":"<id de categoría de la lista dada>","monto":<número entero positivo, sin puntos ni comas>,"nota":"<2-4 palabras describiendo el gasto/ingreso, sin emojis>","fecha":"<YYYY-MM-DD o null si no se menciona>","cuentaId":"<id de cuenta de la lista dada, o null si no se menciona ninguna>"}. Si no podés identificar un monto claro, poné "monto":0. Elegí "categoria" ÚNICAMENTE de los ids de categoría que te paso, el más parecido semánticamente. No escribas nada antes ni después del JSON: nada de razonamiento, borradores, ni bloques de código con acentos graves.';

/* Limpieza de seguridad: por si el modelo igual devuelve markdown pese al
   prompt, quitamos negrita/cursiva/encabezados/listas para que se vea bien
   en la app (que solo interpreta texto plano). */
function stripMarkdown(text){
  if(!text) return text;
  return text
    .replace(/^#{1,6}\s+/gm, '')        // encabezados #, ##, etc.
    .replace(/\*\*(.+?)\*\*/g, '$1')    // negrita **texto**
    .replace(/\*(.+?)\*/g, '$1')        // cursiva *texto*
    .replace(/__(.+?)__/g, '$1')        // negrita __texto__
    .replace(/_(.+?)_/g, '$1')          // cursiva _texto_
    .replace(/^\s*[-*+]\s+/gm, '• ')    // listas con - * + -> viñeta simple
    .replace(/^\s*\d+\.\s+/gm, '')      // listas numeradas "1. "
    .replace(/`{1,3}(.+?)`{1,3}/g, '$1') // código `texto`
    .trim();
}

/* Algunos modelos (sobre todo variantes de Gemma servidas vía un
   endpoint "compatible con Gemini") ignoran systemInstruction y
   devuelven el prompt del sistema pegado antes de la respuesta real,
   o repiten la pregunta del usuario. Esto lo limpia como respaldo. */
function stripEchoedPrompt(text, userText){
  if(!text) return text;
  let out = text;
  const promptStart = SYSTEM_PROMPT.slice(0, 40);
  const idxPrompt = out.indexOf(promptStart);
  if(idxPrompt !== -1){
    // Buscamos dónde termina el prompt repetido y nos quedamos con lo de después
    const afterPromptIdx = idxPrompt + SYSTEM_PROMPT.length;
    const tail = out.slice(afterPromptIdx);
    out = tail.trim().length > 0 ? tail : out.slice(idxPrompt + promptStart.length);
  }
  if(userText){
    const idxUser = out.indexOf(userText.trim().slice(0, 30));
    if(idxUser !== -1 && idxUser < 200){
      const afterUserIdx = idxUser + userText.trim().length;
      const tail = out.slice(afterUserIdx);
      if(tail.trim().length > 0) out = tail;
    }
  }
  return out.replace(/^(system:|user:|assistant:)\s*/i, '').trim();
}

/* Algunos modelos (típicamente Gemma servido como si fuera un modelo de
   razonamiento) "piensan en voz alta" en el propio texto de respuesta:
   arman un borrador, listan una autoevaluación de las reglas del prompt
   ("Draft 1:", "Check against constraints:", etc.) y recién después
   escriben el mensaje real, a veces marcado con una etiqueta tipo
   "Text:" o "Texto:". Esto corta todo lo anterior a esa etiqueta o,
   si no hay etiqueta, todo lo anterior al último bloque de borrador
   detectado. */
function stripReasoningPreamble(text){
  if(!text) return text;
  let out = text;
  const labelRegex = /(?:^|\n)\s*(?:text|texto|respuesta final|respuesta)\s*:\s*/gi;
  let lastLabel = null, m;
  while((m = labelRegex.exec(out)) !== null){ lastLabel = m; }
  if(lastLabel){
    return out.slice(lastLabel.index + lastLabel[0].length).trim();
  }
  const draftRegex = /(?:^|\n)\s*(?:draft\s*\d*|borrador\s*\d*|check against constraints?)\s*:?/gi;
  let lastDraft = null;
  while((m = draftRegex.exec(out)) !== null){ lastDraft = m; }
  if(lastDraft){
    return out.slice(lastDraft.index + lastDraft[0].length).trim();
  }
  return out;
}

/* Respaldo extra: si el modelo escribió la respuesta final dos veces
   seguidas (pegadas, sin separador), nos quedamos con una sola copia. */
function collapseRepeatedTail(text){
  if(!text) return text;
  const t = text.trim();
  const len = t.length;
  const minRepeat = 15; // evita falsos positivos en respuestas muy cortas
  for(let k = Math.floor(len / 2); k >= minRepeat; k--){
    if(t.slice(len - k) === t.slice(len - 2 * k, len - k)){
      return t.slice(0, len - k).trim();
    }
  }
  return t;
}

/* Solución principal: le pedimos al modelo que devuelva SOLO un JSON con
   un campo "mensaje". Así, aunque el modelo agregue borrador o razonamiento
   alrededor (algo común en Gemma), extraemos directamente el valor de ese
   campo con una expresión regular tolerante — no importa cuánto texto
   sobre alrededor. Devuelve null si no se pudo encontrar un campo "mensaje"
   usable, para que callAI recurra al fallback heurístico anterior. */
function extractMensajeField(text){
  if(!text) return null;

  // Intento 1: el texto completo ES el JSON (caso ideal, modelo obediente).
  try {
    const obj = JSON.parse(text.trim());
    if(obj && typeof obj.mensaje === 'string' && obj.mensaje.trim()) return obj.mensaje.trim();
  } catch(e){}

  // Intento 2: el modelo puso texto/borrador alrededor del JSON. OJO: ese
  // borrador a veces incluye, como ejemplo o cita, el propio formato pedido
  // (p.ej. el modelo escribe `{"mensaje": "text"}` al repetir la consigna,
  // con "text" como placeholder literal). Ese bloque también es JSON válido,
  // así que si nos quedáramos con el PRIMER bloque que parsea bien podríamos
  // agarrar ese placeholder en vez de la respuesta real. La respuesta real
  // casi siempre es el ÚLTIMO bloque { ... } de la respuesta (el modelo
  // "piensa" primero y recién al final escribe el JSON definitivo), así que
  // recorremos los bloques de atrás para adelante.
  const braceMatches = text.match(/\{[\s\S]*?\}/g);
  if(braceMatches){
    for(let i = braceMatches.length - 1; i >= 0; i--){
      try {
        const obj = JSON.parse(braceMatches[i]);
        if(obj && typeof obj.mensaje === 'string' && obj.mensaje.trim()) return obj.mensaje.trim();
      } catch(e){}
    }
  }

  // Intento 3: el JSON está roto (comillas sin escapar, coma final, etc.)
  // pero el campo "mensaje": "..." sigue siendo reconocible. Por la misma
  // razón que arriba, nos quedamos con la ÚLTIMA aparición del campo en el
  // texto, no la primera. Lo extraemos con regex y desescapamos manualmente
  // usando el parser de strings de JSON.
  const fieldRegex = /"mensaje"\s*:\s*"((?:\\.|[^"\\])*)"/g;
  let lastFieldMatch = null, fm;
  while((fm = fieldRegex.exec(text)) !== null){ lastFieldMatch = fm; }
  if(lastFieldMatch && lastFieldMatch[1].trim()){
    try {
      return JSON.parse('"' + lastFieldMatch[1] + '"').trim();
    } catch(e){
      return lastFieldMatch[1].trim();
    }
  }

  return null;
}

function callAI(userText){
  const cfg = state.aiConfig;
  const promise = cfg.provider === 'gemini' ? callGemini(userText) : callOpenAI(userText);
  return promise.then(text => {
    console.log('[DEBUG callAI] Respuesta cruda del modelo:', text);
    const mensaje = extractMensajeField(text);
    console.log('[DEBUG callAI] extractMensajeField devolvió:', mensaje);
    if(mensaje !== null) return stripMarkdown(mensaje);

    // Fallback: el modelo ignoró el formato JSON. Usamos las heurísticas
    // anteriores (echo del prompt, preámbulo de razonamiento, repetición).
    return Promise.resolve(text)
      .then(t => stripEchoedPrompt(t, userText))
      .then(stripReasoningPreamble)
      .then(collapseRepeatedTail)
      .then(stripMarkdown);
  });
}

function callOpenAI(userText){
  const cfg = state.aiConfig;
  if(!cfg.apiKey) return Promise.reject({ kind:'no-key' });
  return fetch(cfg.apiUrl, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + cfg.apiKey
    },
    body: JSON.stringify({
      model: cfg.model || 'gpt-4o-mini',
      messages: [
        {role:'system', content: SYSTEM_PROMPT},
        {role:'user', content: userText}
      ]
    })
  })
  .then(async r=>{
    if(!r.ok){ const body = await r.text().catch(()=> ''); throw { kind:'http', status:r.status, body }; }
    return r.json();
  })
  .then(data=>{
    const answer = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(!answer) throw { kind:'empty' };
    return answer;
  });
}

function callGemini(userText){
  const cfg = state.aiConfig;
  if(!cfg.geminiApiKey) return Promise.reject({ kind:'no-key' });
  const model = cfg.geminiModel || 'gemini-2.0-flash';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(cfg.geminiApiKey)}`;
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: [
        { role: 'user', parts: [{ text: userText }] }
      ]
    })
  })
  .then(async r=>{
    if(!r.ok){ const body = await r.text().catch(()=> ''); throw { kind:'http', status:r.status, body }; }
    return r.json();
  })
  .then(data=>{
    const answer = data.candidates && data.candidates[0] && data.candidates[0].content &&
      data.candidates[0].content.parts && data.candidates[0].content.parts.map(p=>p.text||'').join('');
    if(!answer) throw { kind:'empty' };
    return answer;
  });
}

/* Traduce errores técnicos de la API a mensajes claros para el usuario */
function aiErrorMessage(err){
  if(err && err.kind === 'no-key') return 'Falta configurar tu clave de API en Ajustes.';
  if(err && err.kind === 'empty') return 'La IA no devolvió ninguna respuesta. Probá de nuevo en unos segundos.';
  if(err && err.kind === 'http'){
    if(err.status === 401 || err.status === 403) return 'Tu clave de API no es válida o no tiene permisos. Revisala en Ajustes.';
    if(err.status === 429) return 'Se alcanzó el límite de uso de la API por ahora. Esperá un momento y volvé a intentar.';
    if(err.status >= 500) return 'El servicio de IA no está disponible en este momento. Probá más tarde.';
    return `Error al consultar la IA (HTTP ${err.status}). Revisá tu clave de API, el modelo y tu conexión.`;
  }
  if(err && err.message) return `No se pudo conectar con la IA (${err.message}). Revisá tu conexión a internet.`;
  return 'No se pudo conectar con la IA. Revisá tu clave de API, el modelo o tu conexión a internet.';
}

function submitAddWithAI(e){
  e.preventDefault();
  const texto = document.getElementById('ai_tx_text').value.trim();
  if(!texto) return false;
  const btn = document.getElementById('ai_tx_submit_btn');
  const body = document.getElementById('ai_tx_body');
  btn.disabled = true; btn.textContent = 'Pensando...';
  body.innerHTML = `<div class="ai-skeleton mt-3.5"><div class="line" style="width:100%"></div><div class="line" style="width:80%"></div></div>`;

  const cats = expenseCats().concat(incomeCats());
  let prompt = `Hoy es ${todayISO()} (formato AAAA-MM-DD). Tengo estas cuentas:\n`;
  state.accounts.forEach(a => { prompt += `- id "${a.id}": ${a.name}\n`; });
  prompt += `\nY estas categorías disponibles:\n`;
  cats.forEach(c => { prompt += `- id "${c.id}" (${c.label}), tipo ${INCOME_CATS.concat(state.customCategories.filter(x=>x.type==='ingreso')).some(ic=>ic.id===c.id) ? 'ingreso' : 'gasto'}\n`; });
  prompt += `\nEste es el texto del usuario describiendo un gasto o ingreso: "${texto.replace(/"/g,"'")}"\n\nInterpretalo y extraé los datos del movimiento.` + JSON_TRANSACCION_INSTRUCTION;

  callAI(prompt)
    .then(answer => {
      const parsed = extractTransactionJSON(answer);
      if(!parsed || !parsed.monto || Number(parsed.monto) <= 0) throw new Error('no se pudo interpretar');
      renderAddWithAIResult(parsed, texto);
    })
    .catch(() => {
      body.innerHTML = `<div class="flex gap-2.5 items-center p-3 rounded-xl text-[12.5px] leading-relaxed mt-3.5 ${insightClasses('rust')}"><span>⚠️</span><span>No se pudo interpretar el movimiento. Probá ser más específico (monto y en qué) o cargalo manualmente.</span></div>`;
    })
    .finally(() => {
      btn.disabled = false; btn.textContent = '✨ Interpretar';
    });

  return false;
}

/* Igual que extractMensajeField: busca el ÚLTIMO bloque {...} que parsee
   como JSON válido con los campos esperados, para no agarrar por error un
   ejemplo del formato que el modelo haya citado en su propio razonamiento. */
function extractTransactionJSON(text){
  if(!text) return null;
  try {
    const obj = JSON.parse(text.trim());
    if(obj && obj.tipo && obj.categoria) return obj;
  } catch(e){}
  const braceMatches = text.match(/\{[\s\S]*?\}/g);
  if(braceMatches){
    for(let i = braceMatches.length - 1; i >= 0; i--){
      try {
        const obj = JSON.parse(braceMatches[i]);
        if(obj && obj.tipo && obj.categoria) return obj;
      } catch(e){}
    }
  }
  return null;
}

function renderAddWithAIResult(parsed, textoOriginal){
  const body = document.getElementById('ai_tx_body');

  const tipo = parsed.tipo === 'ingreso' ? 'ingreso' : 'gasto';

      <div class="flex justify-between items-center mb-2.5">

}
